name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the submodules the build actually needs. ext/mame is the reference
# oracle, hundreds of megabytes CI never compiles, and is deliberately absent.
env:
  CI_SUBMODULES: ext/unity

jobs:
  linux:
    name: linux (debian family)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 $CI_SUBMODULES
      # lua enables the oracle dump-format test; it is best-effort, so a
      # runner without it still builds and tests the core.
      # lua for the oracle dump-format test; libpng for the screenshot
      # round-trip. Both are best-effort -- the build and the rest of the
      # suite are unaffected by a runner without them, and the PNG test
      # reports itself ignored rather than failing.
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 libpng-dev
      - run: cmake --preset linux-ci
      - run: cmake --build --preset linux-ci
      - run: ctest --preset linux-ci --output-on-failure

  rocky:
    name: rocky (rhel family)
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      # git must be installed BEFORE actions/checkout: with no git in the image
      # checkout silently falls back to a REST tarball with no .git, and the
      # later submodule update dies with "not a git repository".
      - name: Install toolchain
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y clang cmake ninja-build git python3 lua libpng-devel
      - uses: actions/checkout@v4
      - name: Trust the container checkout
        run: git config --global --add safe.directory '*'
      - run: git submodule update --init --depth 1 $CI_SUBMODULES
      - run: cmake --preset linux-ci
      - run: cmake --build --preset linux-ci
      - run: ctest --preset linux-ci --output-on-failure

  windows:
    name: windows (clang in msvc env)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 ext/unity
      - uses: ilammy/msvc-dev-cmd@v1
      - run: choco install ninja -y
      # libpng here for the same reason the other three jobs have it, and one
      # more that matters only here: `ap_png.c` is the newest platform-sensitive
      # file in the tree -- setjmp, a pointer cast through uintptr_t, and size_t
      # arithmetic under -Wconversion -Werror. Without a libpng its body is
      # #ifdef'd out, so the job whose whole purpose is catching portability
      # defects would not compile the file most likely to have one. vcpkg is
      # preinstalled on windows-latest; the build is from source and costs a
      # few minutes, which is what that coverage is worth.
      - run: vcpkg install libpng:x64-windows
      - run: >
          cmake --preset windows-ci
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: pwsh
      - run: cmake --build --preset windows-ci
      - run: ctest --preset windows-ci --output-on-failure

  macos:
    name: macos (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 $CI_SUBMODULES
      - run: brew install ninja lua libpng
      - run: cmake --preset macos-ci
      - run: cmake --build --preset macos-ci
      - run: ctest --preset macos-ci --output-on-failure

  # Emulated cycle counts are not wall-clock measurements: the same workload
  # must produce identical results at -O0 and -O3. A difference is a real bug
  # (undefined behaviour, a width assumption), not a build artefact.
  identical-across-build-types:
    name: results identical at -O0 and -O3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 $CI_SUBMODULES
      - run: cmake --preset linux-ci && cmake --build --preset linux-ci
      - run: cmake --preset linux-release && cmake --build --preset linux-release
      # No hand-rolled diff of the two builds against each other any more: that
      # passes when both have drifted together. Each ctest run checks its build
      # against the *committed* golden, so agreeing with each other is implied
      # and agreeing with what was reviewed is actually asserted. The same
      # entries run on the other three platforms, which is what makes the
      # goldens portable rather than merely reproducible here.
      - run: ctest --preset linux-ci --output-on-failure
      - run: ctest --preset linux-release --output-on-failure
